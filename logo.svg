<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 72" role="img" aria-label="UrbanAir Twin — Metropolitan Intelligence">
  <g transform="translate(4 4)">
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22332a"/>
      <stop offset="1" stop-color="#111915"/>
    </linearGradient>
    <clipPath id="l-tile"><rect width="64" height="64" rx="15"/></clipPath>
    <!-- real half / twin half of the same circle, with a small seam -->
    <clipPath id="l-left"><path d="M31 10 A22 22 0 0 0 31 54 Z"/></clipPath>
    <clipPath id="l-right"><path d="M33 10 A22 22 0 0 1 33 54 Z"/></clipPath>
    <pattern id="l-dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#adceb8" fill-opacity="0.55"/>
    </pattern>
  </defs>
  <g clip-path="url(#l-tile)">
    <rect width="64" height="64" fill="url(#l-bg)"/>

    <!-- REAL: solid air, solid city -->
    <g clip-path="url(#l-left)">
      <rect x="8" y="8" width="24" height="48" fill="#adceb8"/>
      <g fill="#14201a">
        <rect x="10" y="41" width="6" height="16"/>
        <rect x="17" y="35" width="6" height="22"/>
        <rect x="24" y="27" width="7" height="30"/>
      </g>
    </g>

    <!-- TWIN: the same city as a scanned wireframe -->
    <g clip-path="url(#l-right)">
      <rect x="32" y="8" width="24" height="48" fill="url(#l-dots)"/>
      <g fill="#111915" stroke="#adceb8" stroke-width="1.6" stroke-linejoin="round">
        <rect x="33.8" y="27.8" width="6.4" height="30"/>
        <rect x="41.8" y="35.8" width="5.4" height="22"/>
        <rect x="48.8" y="41.8" width="5.4" height="16"/>
      </g>
    </g>
    <path d="M33 10.4 A21.6 21.6 0 0 1 33 53.6" fill="none" stroke="#adceb8" stroke-width="1.6"/>

    <!-- AIR: one stream that flows through both -->
    <path d="M3 25 C15 15 25 31 35 23 S53 13 61 17" fill="none" stroke="#111915" stroke-width="6" stroke-linecap="round"/>
    <path d="M3 25 C15 15 25 31 35 23 S53 13 61 17" fill="none" stroke="#ecbf83" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</g>
  <text x="86" y="39" font-family="Manrope, 'Segoe UI', sans-serif" font-size="30" font-weight="800" letter-spacing="-0.6" fill="#e2e3e0">UrbanAir<tspan fill="#adceb8" font-weight="500"> Twin</tspan></text>
  <text x="87" y="58" font-family="Inter, 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" letter-spacing="2.6" fill="#8c928c">METROPOLITAN INTELLIGENCE</text>
</svg>
